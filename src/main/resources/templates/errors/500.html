<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head><title>Server Error</title></head>
<body>
<th:block th:replace="~{fragments/layout :: layout('500', ~{::main-content})}">
    <th:block th:fragment="main-content">
        <div class="hero min-h-[50vh]">
            <div class="hero-content text-center">
                <div>
                    <h1 class="text-6xl font-bold text-error">500</h1>
                    <p class="py-4" th:text="${message}">Eroare internă</p>
                    <a th:href="@{/}" class="btn btn-primary">Înapoi acasă</a>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</body>
</html>
