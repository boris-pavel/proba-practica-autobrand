services:
  db:
    image: postgres:16-alpine
    container_name: autobrand-db
    environment:
      POSTGRES_DB: autobrand
      POSTGRES_USER: autobrand
      POSTGRES_PASSWORD: dev_password
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "autobrand"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: autobrand-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SCRAPER_USERNAME: ${SCRAPER_USERNAME:-user123}
      SCRAPER_PASSWORD: ${SCRAPER_PASSWORD:-password}

volumes:
  db_data: